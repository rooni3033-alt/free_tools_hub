<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Tools Hub - أدوات ومقالات مجانية متجددة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.8rem; }
        p.subtitle { color: var(--text-muted); margin-top: 5px; }
        
        section {
            margin-bottom: 40px;
        }
        h2 {
            font-size: 1.3rem;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .card a {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .card a:hover { background-color: var(--accent-hover); }
        .articles-list {
            list-style: none;
            padding: 0;
        }
        .articles-list li {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            padding: 10px 15px;
            border-radius: 6px;
        }
        .articles-list a {
            color: #60a5fa;
            text-decoration: none;
        }
        .articles-list a:hover { text-decoration: underline; }
        .loading { color: var(--text-muted); text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Free Tools Hub</h1>
                <p class="subtitle">منصة الأدمجة والأدوات والمقالات المجتمعية التلقائية</p>
            </div>
        </header>

        <!-- قسم الأدوات -->
        <section>
            <h2>🛠️ الأدوات المتاحة (Available Tools)</h2>
            <div id="toolsGrid" class="loading">جاري تحميل الأدوات...</div>
        </section>

        <!-- قسم المقالات -->
        <section>
            <h2>📚 أرشيف المقالات والمدونات (Articles History)</h2>
            <ul id="articlesList" class="articles-list">
                <div class="loading">جاري تحميل المقالات...</div>
            </ul>
        </section>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('database.json');
                if (!response.ok) throw new Error('فشل في جلب ملف البيانات');
                const data = await response.json();

                // عرض الأدوات
                const toolsGrid = document.getElementById('toolsGrid');
                if (data.tools && data.tools.length > 0) {
                    toolsGrid.className = 'grid';
                    toolsGrid.innerHTML = data.tools.map(tool => `
                        <div class="card">
                            <div>
                                <h3>${tool.name}</h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem;">تم إنشاؤه عبر نظام الأتمتة</p>
                            </div>
                            <a href="${tool.tool_url}" target="_blank">فتح الأداة 🚀</a>
                        </div>
                    `).join('');
                } else {
                    toolsGrid.innerHTML = '<p style="color: var(--text-muted);">لا توجد أدوات منشورة حالياً.</p>';
                }

                // عرض المقالات
                const articlesList = document.getElementById('articlesList');
                if (data.articles_history && data.articles_history.length > 0) {
                    // عكس الترتيب لعرض أحدث المقالات في الأعلى
                    const reversedArticles = [...data.articles_history].reverse();
                    articlesList.innerHTML = reversedArticles.map(item => `
                        <li>
                            📄 مقال مرتبط بالأداة: <strong>${item.tool_slug}</strong><br>
                            <div style="margin-top: 5px; display: flex; gap: 15px; font-size: 0.9rem;">
                                <a href="${item.article_1}" target="_blank">🔗 قراءة الدليل الشامل (Guide)</a>
                                <a href="${item.article_2}" target="_blank">🔗 قراءة النصائح والحلول (Tips)</a>
                            </div>
                        </li>
                    `).join('');
                } else {
                    articlesList.innerHTML = '<p style="color: var(--text-muted);">لا توجد مقالات منشورة حالياً.</p>';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('toolsGrid').innerHTML = '<p style="color: #ef4444;">تعذر تحميل البيانات. تأكد من تفعيل GitHub Pages وأن ملف database.json مرفوع.</p>';
                document.getElementById('articlesList').innerHTML = '';
            }
        }

        loadData();
    </script>
</body>
</html>
