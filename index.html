<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Tools Hub - منصة الأدوات الشاملة</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        header { margin-bottom: 30px; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; }
        .search-box { width: 100%; max-width: 500px; padding: 12px 20px; font-size: 16px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; margin-bottom: 30px; outline: none; }
        .container { max-width: 1000px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; text-align: left; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); border-color: #4f46e5; }
        .card h3 { margin-top: 0; color: #f8fafc; font-size: 18px; }
        .card p { font-size: 14px; color: #cbd5e1; flex-grow: 1; }
        .btn { display: inline-block; background: #4f46e5; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-weight: bold; text-align: center; margin-top: 15px; transition: 0.2s; }
        .btn:hover { background: #4338ca; }
    </style>
</head>
<body>

    <header>
        <h1>Free Tools Hub</h1>
        <p>منصة الأدوات العالمية الذكية والآمنة 100%</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search tools by name... / ابحث عن أداة..." onkeyup="filterTools()">

    <div class="container" id="toolsGrid">
        <!-- يتم تعبئة الأدوات تلقائياً -->
    </div>

    <script>
        let allToolsData = [];

        fetch('database.json')
            .then(response => response.json())
            .then(data => {
                if(data.tools) {
                    allToolsData = data.tools;
                    renderTools(allToolsData);
                }
            });

        function renderTools(tools) {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = "";
            if(tools.length > 0) {
                tools.forEach(tool => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <h3>${tool.name}</h3>
                            <p>أداة مجانية احترافية تعمل بشكل فوري وآمن داخل متصفحك.</p>
                        </div>
                        <a class="btn" href="${tool.tool_url}">فتح الأداة 🚀</a>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No tools found matching your search.</p>";
            }
        }

        function filterTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allToolsData.filter(t => t.name.toLowerCase().includes(query));
            renderTools(filtered);
        }
    </script>

</body>
</html>
