<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Tools Hub - منصة الأدوات والمقالات التلقائية</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        header { margin-bottom: 40px; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; }
        .container { max-width: 1000px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; text-align: left; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { margin-top: 0; color: #f8fafc; font-size: 18px; }
        .card p { font-size: 14px; color: #cbd5e1; flex-grow: 1; }
        .btn { display: inline-block; background: #4f46e5; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-weight: bold; text-align: center; margin-top: 15px; transition: 0.2s; }
        .btn:hover { background: #4338ca; }
    </style>
</head>
<body>

    <header>
        <h1>Free Tools Hub</h1>
        <p>منصة الأدوات والمقالات التلقائية الشاملة</p>
    </header>

    <div class="container" id="toolsGrid">
        <!-- سيتم تعبئة الأدوات تلقائياً من database.json -->
    </div>

    <script>
        fetch('database.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('toolsGrid');
                if(data.tools && data.tools.length > 0) {
                    data.tools.forEach(tool => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div>
                                <h3>${tool.name}</h3>
                                <p>تم إنشاؤه عبر نظام الأتمتة لتقديم أفضل أداء فوري.</p>
                            </div>
                            <a class="btn" href="${tool.tool_url}" target="_blank">فتح الأداة 🚀</a>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>جاري توليد الأدوات عبر نظام الأتمتة...</p>";
                }
            })
            .catch(err => {
                document.getElementById('toolsGrid').innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>قيد التحديث، يرجى تحديث الصفحة بعد قليل.</p>";
            });
    </script>

</body>
</html>
