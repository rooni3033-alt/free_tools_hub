name: Autonomous Machine Engine

on:
  schedule:
    - cron: '0 */3 * * *'  # يعمل تلقائياً كل 3 ساعات
  workflow_dispatch: # زر التشغيل اليدوي من لوحة تحكم GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Run Automation Script
        run: python main.py

      - name: Commit and push generated files
        run: |
          git config --global user.name 'Autonomous Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add .
          # التحقق من وجود تغييرات جديدة قبل عمل commit لتجنب أخطاء النظام
          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-deploy: tools, articles, and sitemap update [Bot]"
            git push
          fi
