# Empire Web — Global Auto Deploy Pipeline
# Automatically generates tools (up to 500) + infinite articles every 3 hours
# ووردفلو التحديث التلقائي العالمي — يولد الأدوات والمقالات كل 3 ساعات

name: Empire Auto Build & Deploy

on:
  # تشغيل تلقائي كل 3 ساعات
  schedule:
    - cron: '0 */3 * * *'
  
  # تشغيل يدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "empire-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository with full history
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies (if any requirements.txt exists in future)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run the Empire Engine generator
      - name: Generate Tools & Articles
        run: python main.py

      # 5. Check for actual file changes (git diff guard)
      - name: Detect Changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No new changes detected. Skipping commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected. Preparing commit..."
            git diff --cached --stat
          fi

      # 6. Commit & Push only if changes exist
      - name: Commit and Push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "🤖 Auto Build: +tools/articles [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin ${{ github.ref_name }}

      # 7. Deploy to GitHub Pages (modern method via artifact)
      # If you use "Deploy from a branch" in Settings > Pages, this step is optional
      # because pushing to the branch auto-triggers Pages. Included for robustness.
      - name: Setup Pages
        if: steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.diff.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
