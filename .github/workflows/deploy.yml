name: Autonomous Machine Engine

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Automation Script
        run: python main.py

      - name: Commit and push generated files
        run: |
          git config --global user.name 'Autonomous Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add .
          git commit -m "Auto-deploy: tools and continuous articles update"
          git push
