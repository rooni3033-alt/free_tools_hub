name: Auto Generate & Deploy

on:
  schedule:
    # تشغيل كل 3 ساعات
    - cron: '0 */3 * * *'
  # السماح بالتشغيل اليدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. إعداد Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. تشغيل المحرك البرمجي
      - name: Run Content Generator
        run: python main.py

      # 4. التحقق من وجود تغييرات (شرط git diff)
      - name: Check for changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected, ready to commit."
          fi

      # 5. رفع التغييرات فقط إذا وجدت
      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "🤖 Auto: New tools/articles [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push
